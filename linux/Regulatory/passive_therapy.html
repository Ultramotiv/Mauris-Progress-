<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passive Therapy Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #000000 0%, #1a3a34 50%, #2d5a4f 75%, #44b8a6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .container {
            background: rgba(50, 54, 58, 0.95);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            text-align: center;
            backdrop-filter: blur(10px);
            color: #f0f4f8;
        }

        h1 {
            color: #e2e8f0;
            margin-bottom: 1.25rem;
            font-size: 1.5rem;
        }

        .panel {
            background: rgba(30, 41, 59, 0.7);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(68, 184, 166, 0.4);
            color: #e2e8f0;
        }

        .panel-title {
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #93c5fd;
            font-size: 1.1rem;
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .record-btn, .playback-btn {
            padding: 0.6rem 1rem;
            border: 1px solid rgba(68, 184, 166, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .record-btn {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: white;
        }

        .record-btn:hover {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4);
        }

        .stop-btn {
            background: linear-gradient(135deg, #e53e3e 0%, #c53030 100%);
            color: white;
        }

        .stop-btn:hover {
            background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(229, 62, 62, 0.4);
        }

        .select-exercise {
            margin: 0.75rem 0;
        }

        select, input[type="number"] {
            padding: 0.5rem;
            border: 1px solid #475569;
            border-radius: 4px;
            background: #1e293b;
            color: #e2e8f0;
            width: 100%;
            max-width: 200px;
            margin: 0 auto;
            display: block;
        }

        .mode-btn {
            width: 100%;
            padding: 0.75rem;
            margin: 0.5rem 0;
            background: linear-gradient(135deg, #9f7aea 0%, #805ad5 100%);
            color: white;
            border: 1px solid rgba(68, 184, 166, 0.3);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            background: linear-gradient(135deg, #b779da 0%, #9f7aea 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(159, 122, 234, 0.5);
        }

        .status {
            padding: 0.75rem;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 8px;
            margin: 1rem 0;
            text-align: left;
            font-weight: 600;
            color: #c7d2fe;
            border: 1px solid rgba(68, 184, 166, 0.4);
        }

        .telemetry {
            padding: 1rem;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 8px;
            margin: 1rem 0;
            text-align: left;
            border: 1px solid rgba(68, 184, 166, 0.4);
        }

        .telemetry h3 {
            color: #93c5fd;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .telemetry p {
            margin: 0.25rem 0;
            font-size: 0.9rem;
            color: #e2e8f0;
        }

        .back-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #555 0%, #333 100%);
            color: white;
            border: 1px solid rgba(68, 184, 166, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            border-color: #ff9800;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Passive Therapy Mode</h1>

        <!-- RECORDING PANEL -->
        <div class="panel">
            <div class="panel-title">Record Exercise Trajectory</div>
            <div class="btn-group">
                <button class="record-btn" id="start-record" onclick="startRecording()">Start Recording</button>
                <button class="record-btn stop-btn" id="stop-record" onclick="stopRecording()" disabled>Stop Recording</button>
            </div>
            <div id="record-status" style="margin-top: 0.5rem; font-size: 0.9rem; color: #cbd5e1;">Not recording</div>
        </div>

        <!-- PLAYBACK PANEL -->
        <div class="panel">
            <div class="panel-title">Playback Recorded Exercise</div>
            <div class="select-exercise">
                <select id="exercise-select" onchange="loadExerciseDetails()">
                    <option value="">Select a recorded exercise...</option>
                </select>
            </div>
            <div style="margin: 0.75rem 0;">
                <label style="display: block; margin-bottom: 0.25rem; color: #cbd5e1;">Repetitions:</label>
                <input type="number" id="repetition-count" min="1" max="20" value="5" />
            </div>
            <!-- ✅ ADD THIS NEW DIV TO SHOW CURRENT REPETITION -->
            <div style="margin: 0.75rem 0; color: #93c5fd; font-weight: 600;">
                Current Rep: <span id="current-rep">0</span>
            </div>
            <button class="mode-btn" id="playback-btn" onclick="startPlayback()" disabled>Start Playback</button>
        </div>

        <!-- DRAG MODE -->
        <button class="mode-btn" id="drag-btn" onclick="toggleDragMode()">Drag Mode</button>

        <div class="status" id="status-display">Switching to Passive Mode...</div>

        <div class="telemetry">
            <h3>Real-time Telemetry</h3>
            <p><strong>Fz Force:</strong> <span id="fz-value">0.00</span> N</p>
            <p><strong>TCP Z Position:</strong> <span id="z-value">0.00</span> mm</p>
            <p><strong>Max Velocity Limit:</strong> 60°/s</p>
        </div>

        <button class="back-btn" onclick="goBack()">← Back to Main Menu</button>
    </div>

    <script>
        let dragActive = false;
        let recording = false;
        let playbackRunning = false;
        let recordedExercises = [];
        let modeSet = false;

        function callAPI(endpoint, data = null) {
            const options = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            };
            if (data) options.body = JSON.stringify(data);
            return fetch(`http://localhost:5000${endpoint}`, options);
        }

        function setPassiveMode() {
            return callAPI('/set_mode', { mode: 'passive' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        modeSet = true;
                        document.getElementById('status-display').textContent = 'Ready';
                        loadRecordedExercises();
                    } else {
                        document.getElementById('status-display').textContent = '❌ Failed to enter Passive Mode';
                    }
                })
                .catch(err => {
                    document.getElementById('status-display').textContent = '⚠️ Server unreachable';
                    console.error('Mode set error:', err);
                });
        }

        // ===== RECORDING =====
        function startRecording() {
            if (!modeSet) {
                alert('Please wait until Passive Mode is ready');
                return;
            }
            if (dragActive) {
                alert('Disable Drag Mode before recording');
                return;
            }
            
            // ✅ THIS IS THE CRITICAL PART: PROMPT FOR NAME
            const name = prompt("Enter a name for this trajectory:");
            if (!name || name.trim() === '') {
                alert("Recording cancelled or empty name.");
                return;
            }

            // ✅ SEND THE NAME TO THE BACKEND
            callAPI('/start_recording', { name: name.trim() })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        recording = true;
                        document.getElementById('start-record').disabled = true;
                        document.getElementById('stop-record').disabled = false;
                        document.getElementById('record-status').textContent = `🔴 Recording: ${data.name}`;
                        updateStatus();
                    } else {
                        alert('Recording failed: ' + (data.message || 'Unknown'));
                    }
                })
                .catch(err => {
                    alert('Failed to start recording. Is server running?');
                    console.error(err);
                });
        }

        function stopRecording() {
            callAPI('/stop_recording')
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        recording = false;
                        document.getElementById('start-record').disabled = false;
                        document.getElementById('stop-record').disabled = true;
                        document.getElementById('record-status').textContent = `✅ Saved as: ${data.name}`;
                        loadRecordedExercises();
                        updateStatus();
                    } else {
                        alert('Stop recording failed: ' + (data.message || 'Unknown'));
                    }
                })
                .catch(err => {
                    alert('Failed to stop recording');
                    console.error(err);
                });
        }

        // ===== PLAYBACK =====
        function loadRecordedExercises() {
            fetch('http://localhost:5000/list_recordings')
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById('exercise-select');
                    select.innerHTML = '<option value="">Select a recorded exercise...</option>';
                    recordedExercises = data.files || [];
                    recordedExercises.forEach(file => {
                        const opt = document.createElement('option');
                        opt.value = file;
                        opt.textContent = file;
                        select.appendChild(opt);
                    });
                    document.getElementById('playback-btn').disabled = recordedExercises.length === 0;
                })
                .catch(err => {
                    console.warn('Failed to load recordings:', err);
                });
        }

        function loadExerciseDetails() {
            const filename = document.getElementById('exercise-select').value;
            document.getElementById('playback-btn').disabled = !filename;
        }

        function startPlayback() {
            if (!modeSet) {
                alert('Please wait until Passive Mode is ready');
                return;
            }
            if (dragActive) {
                alert('Disable Drag Mode first');
                return;
            }
            const filename = document.getElementById('exercise-select').value;
            const reps = parseInt(document.getElementById('repetition-count').value) || 5;

            callAPI('/start_playback', { filename, repetitions: reps })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        playbackRunning = true;
                        document.getElementById('playback-btn').textContent = 'Stop Playback';
                        document.getElementById('playback-btn').onclick = stopPlayback;
                        updateStatus();
                    } else {
                        alert('Playback failed: ' + (data.message || 'Unknown'));
                    }
                })
                .catch(err => {
                    alert('Failed to start playback');
                    console.error(err);
                });
        }

        function stopPlayback() {
            callAPI('/stop_playback')
                .then(() => {
                    playbackRunning = false;
                    document.getElementById('playback-btn').textContent = 'Start Playback';
                    document.getElementById('playback-btn').onclick = startPlayback;
                    updateStatus();
                })
                .catch(console.error);
        }

        // ===== DRAG MODE =====
        function toggleDragMode() {
            if (!modeSet) {
                alert('Please wait until Passive Mode is ready');
                return;
            }
            callAPI('/drag_mode', {})
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        dragActive = data.enabled;
                        const btn = document.getElementById('drag-btn');
                        btn.textContent = dragActive ? 'Drag Mode (Active)' : 'Drag Mode';
                        btn.style.background = dragActive 
                            ? 'linear-gradient(135deg, #2ecc71 0%, #27ae60 100%)'
                            : 'linear-gradient(135deg, #9f7aea 0%, #805ad5 100%)';
                        updateStatus();
                    } else {
                        alert('Drag mode failed: ' + (data.message || 'Unknown'));
                    }
                })
                .catch(err => {
                    alert('Drag mode failed. Is robot connected?');
                    console.error(err);
                });
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        function updateStatus() {
            let status = 'Ready';
            if (dragActive) status = 'Drag Mode: Active';
            else if (recording) status = 'Recording Trajectory...';
            else if (playbackRunning) status = 'Playing Back Recorded Exercise';
            document.getElementById('status-display').textContent = status;
        }

        // ✅ UPDATED TO FETCH AND DISPLAY REPETITION COUNT
        function startTelemetry() {
            setInterval(() => {
                fetch('http://localhost:5000/get_telemetry')
                    .then(res => res.json())
                    .then(data => {
                        document.getElementById('fz-value').textContent = data.fz?.toFixed(2) || '0.00';
                        document.getElementById('z-value').textContent = data.tcp_z?.toFixed(2) || '0.00';
                        // Update the repetition counter
                        if (data.playback_active) {
                            document.getElementById('current-rep').textContent = data.playback_repetition_count || '0';
                        } else {
                            document.getElementById('current-rep').textContent = '0';
                        }
                    })
                    .catch(err => {
                        if (!window.location.href.includes('index.html')) {
                            console.warn('Telemetry error');
                        }
                    });
            }, 200);
        }

        window.onload = function() {
            setPassiveMode();
            startTelemetry();
        };
    </script>
</body>
</html>
